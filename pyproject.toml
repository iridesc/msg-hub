[project]
name = "msg-hub"
version = "0.1.0"
description = "多渠道路由的消息发送 MCP 服务：渠道增删改查 + 统一发送"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "mcp>=2.3,<3",
  "starlette>=0.40",
  "uvicorn>=0.30",
  "jsonschema>=4.20",
  "httpx>=0.27",
  "PySocks>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
msg-hub = "msg_hub.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
